name: CI Pipeline - Media Service

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # ── Job 1: Build & Test ───────────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mediatheque_media
          POSTGRES_USER: user_admin
          POSTGRES_PASSWORD: password123
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Build and Test
        run: mvn verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/mediatheque_media
          SPRING_DATASOURCE_USERNAME: user_admin
          SPRING_DATASOURCE_PASSWORD: password123
          JWT_SECRET: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
          EXTERNAL_TMDB_API_KEY: fake-key
          EXTERNAL_TMDB_BASE_URL: http://localhost:9999/tmdb
          EXTERNAL_RAWG_API_KEY: fake-key
          EXTERNAL_RAWG_BASE_URL: http://localhost:9999/rawg
          EXTERNAL_GOOGLE_BOOKS_BASE_URL: http://localhost:9999/books
          EXTERNAL_ITUNES_BASE_URL: http://localhost:9999/itunes

      - name: Upload target for next jobs
        uses: actions/upload-artifact@v4
        with:
          name: target
          path: target/

  # ── Job 2: SonarCloud Analysis ────────────────────────────────────────────
  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Download target
        uses: actions/download-artifact@v4
        with:
          name: target
          path: target/

      - name: SonarCloud Analysis
        run: mvn sonar:sonar -Dsonar.projectKey=Manal-Brikoui_media-svc -Dsonar.organization=manal-brikoui -Dsonar.host.url=https://sonarcloud.io -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ── Job 3: Package & Upload JAR ───────────────────────────────────────────
  package:
    name: Package & Upload JAR
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Download target
        uses: actions/download-artifact@v4
        with:
          name: target
          path: target/

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: media-service-jar
          path: target/*.jar