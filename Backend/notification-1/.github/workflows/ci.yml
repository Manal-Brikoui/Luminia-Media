name: CI Pipeline - Notification Service

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # ── Job 1: Build & Test ───────────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: notification_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Build and Test
        run: mvn verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/notification_db
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          JWT_SECRET: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          SPRING_MAIL_USERNAME: fake@mail.com
          SPRING_MAIL_PASSWORD: fake

      - name: Upload target for next jobs
        uses: actions/upload-artifact@v4
        with:
          name: target
          path: target/

  # ── Job 2: SonarCloud Analysis ────────────────────────────────────────────
  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Download target
        uses: actions/download-artifact@v4
        with:
          name: target
          path: target/

      - name: SonarCloud Analysis
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=Manal-Brikoui_notification-svc \
            -Dsonar.organization=manal-brikoui \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ── Job 3: Package & Upload JAR ───────────────────────────────────────────
  package:
    name: Package & Upload JAR
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Download target
        uses: actions/download-artifact@v4
        with:
          name: target
          path: target/

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: notification-service-jar
          path: target/*.jar