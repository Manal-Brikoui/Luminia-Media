version: '3.8'

services:

  postgres-auth:
    image: postgres:17-alpine
    container_name: postgres-auth
    environment:
      POSTGRES_DB: mediatheque_auth
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    networks:
      - mediatheque_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d mediatheque_auth"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-media:
    image: postgres:17-alpine
    container_name: postgres-media
    environment:
      POSTGRES_DB: mediatheque_media
      POSTGRES_USER: user_admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5433:5432"
    volumes:
      - postgres_media_data:/var/lib/postgresql/data
    networks:
      - mediatheque_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_admin -d mediatheque_media"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-collection:
    image: postgres:17-alpine
    container_name: postgres-collection
    environment:
      POSTGRES_DB: collection_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_collection_data:/var/lib/postgresql/data
    networks:
      - mediatheque_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d collection_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-notification:
    image: postgres:17-alpine
    container_name: postgres-notification
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres_notification_data:/var/lib/postgresql/data
    networks:
      - mediatheque_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notification_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - mediatheque_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mediatheque_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - mediatheque_network
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | timeout 2 nc -w 2 127.0.0.1 2181 | grep -q Mode"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - mediatheque_network
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 90s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8200:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - mediatheque_network

  auth-svc:
    build:
      context: ./pfa-
      dockerfile: Dockerfile
    container_name: auth-svc
    ports:
      - "8081:8081"
    environment:
      SPRING_APPLICATION_NAME: auth-svc
      SERVER_PORT: 8081
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: 86400000
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/mediatheque_auth
      SPRING_DATASOURCE_USERNAME: auth_user
      SPRING_DATASOURCE_PASSWORD: auth_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: true
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: true
      APP_FRONTEND_URL: http://localhost:4200
    depends_on:
      postgres-auth:
        condition: service_healthy
    networks:
      - mediatheque_network
    restart: on-failure

  media-service:
    build:
      context: ./media-1
      dockerfile: Dockerfile
    container_name: media-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-media:5432/mediatheque_media
      SPRING_DATASOURCE_USERNAME: user_admin
      SPRING_DATASOURCE_PASSWORD: password123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FILE_UPLOAD_DIR: /app/uploads
    volumes:
      - ./media-1/uploads:/app/uploads
    depends_on:
      postgres-media:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - mediatheque_network
    restart: on-failure

  collection-service:
    build:
      context: ./Collection1
      dockerfile: Dockerfile
    container_name: collection-service
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-collection:5432/collection_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET}
      SERVICES_MEDIA_SVC_URL: http://media-service:8082
      SPRING_KAFKA_PRODUCER_PROPERTIES_MAX_BLOCK_MS: 5000
      SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET: earliest
      SPRING_KAFKA_LISTENER_MISSING_TOPICS_FATAL: "false"
    depends_on:
      postgres-collection:
        condition: service_healthy
      kafka:
        condition: service_healthy
      media-service:
        condition: service_started
    networks:
      - mediatheque_network
    restart: on-failure

  notification-svc:
    build:
      context: ./notification-1
      dockerfile: Dockerfile
    container_name: notification-svc
    ports:
      - "8086:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-notification:5432/notification_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres-notification:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - mediatheque_network
    restart: on-failure

  python-svc:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: python-svc
    ports:
      - "8085:8085"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MONGO_URL: mongodb://mongo:27017
      TMDB_API_KEY: a1033ea79e48ac68d241562e6af7c888
      MEDIA_SVC_URL: http://media-service:8082
      COLLECTION_DB_URL: postgresql://postgres:postgres@postgres-collection:5432/collection_db
      REDIS_URL: redis://redis:6379
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      media-service:
        condition: service_started
      postgres-collection:
        condition: service_healthy
    networks:
      - mediatheque_network
    restart: on-failure

networks:
  mediatheque_network:
    driver: bridge

volumes:
  postgres_auth_data:
  postgres_media_data:
  postgres_collection_data:
  postgres_notification_data:
  mongo_data:
  redis_data:
  zookeeper_data:
  kafka_data: