 
<div class="min-h-screen bg-gray-50 flex items-center justify-center px-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
 
    <!-- Logo -->
    <div class="text-center mb-8">
      <a routerLink="/" class="inline-flex items-center gap-1 no-underline">
        <span class="text-xl font-bold text-indigo-600">Lumina</span>
        <span class="text-xl font-bold text-gray-900">Media</span>
      </a>
    </div>
 
    <div class="flex items-center justify-center gap-2 mb-8">
      <ng-container *ngFor="let s of [1,2,3]">
        <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold transition-all duration-200"
          [ngClass]="step() >= s ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-400'">
          {{ s }}
        </div>
        <div *ngIf="s < 3" class="w-8 h-0.5 rounded"
          [ngClass]="step() > s ? 'bg-indigo-600' : 'bg-gray-200'"></div>
      </ng-container>
    </div>
 
    <div *ngIf="error()" class="mb-4 px-4 py-3 bg-red-50 border border-red-100 rounded-xl text-sm text-red-600">
      {{ error() }}
    </div>
    <div *ngIf="success()" class="mb-4 px-4 py-3 bg-green-50 border border-green-100 rounded-xl text-sm text-green-600">
      {{ success() }}
    </div>
 
    <div *ngIf="step() === 1">
      <h2 class="text-lg font-bold text-gray-900 mb-1">Mot de passe oublié</h2>
      <p class="text-sm text-gray-400 mb-6">Entrez votre email pour recevoir un code.</p>
      <div class="flex flex-col gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
          <input
            type="email"
            [(ngModel)]="email"
            placeholder="vous@exemple.com"
            (keyup.enter)="sendCode()"
            autocomplete="email"
            class="w-full px-4 py-2.5 text-sm border border-gray-200 rounded-xl outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-50 transition-all"/>
        </div>
        <button
          (click)="sendCode()"
          [disabled]="loading() || !email.trim()"
          class="w-full py-2.5 text-sm font-semibold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 transition-all disabled:opacity-60">
          {{ loading() ? 'Envoi...' : 'Envoyer le code' }}
        </button>
      </div>
    </div>
 
    <div *ngIf="step() === 2">
      <h2 class="text-lg font-bold text-gray-900 mb-1">Vérification</h2>
      <p class="text-sm text-gray-400 mb-6">
        Code envoyé à <span class="text-indigo-600 font-medium">{{ email }}</span>
      </p>
      <div class="flex flex-col gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Code à 6 chiffres</label>
          <input
            type="text"
            inputmode="numeric"
            [value]="code"
            (input)="onCodeInput($event)"
            (keyup.enter)="verifyCode()"
            placeholder="000000"
            maxlength="6"
            autocomplete="one-time-code"
            class="w-full px-4 py-3 text-sm border border-gray-200 rounded-xl outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-50 transition-all tracking-[0.5em] text-center text-xl font-bold"/>
        </div>
        <button
          (click)="verifyCode()"
          [disabled]="loading() || code.length !== 6"
          class="w-full py-2.5 text-sm font-semibold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 transition-all disabled:opacity-60">
          {{ loading() ? 'Vérification...' : 'Valider le code' }}
        </button>
        <button
          (click)="step.set(1)"
          class="text-sm text-gray-400 hover:text-indigo-600 transition-colors bg-transparent border-none cursor-pointer">
          ← Changer d'email
        </button>
      </div>
    </div>
 
    <div *ngIf="step() === 3">
      <h2 class="text-lg font-bold text-gray-900 mb-1">Nouveau mot de passe</h2>
      <p class="text-sm text-gray-400 mb-6">Choisissez un mot de passe sécurisé.</p>
      <div class="flex flex-col gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Nouveau mot de passe</label>
          <input
            type="password"
            [(ngModel)]="newPassword"
            placeholder="••••••••"
            autocomplete="new-password"
            class="w-full px-4 py-2.5 text-sm border border-gray-200 rounded-xl outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-50 transition-all"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Confirmer</label>
          <input
            type="password"
            [(ngModel)]="confirmPassword"
            placeholder="••••••••"
            (keyup.enter)="resetPassword()"
            autocomplete="new-password"
            class="w-full px-4 py-2.5 text-sm border border-gray-200 rounded-xl outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-50 transition-all"/>
        </div>
        <button
          (click)="resetPassword()"
          [disabled]="loading() || !newPassword || !confirmPassword"
          class="w-full py-2.5 text-sm font-semibold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 transition-all disabled:opacity-60">
          {{ loading() ? 'Réinitialisation...' : 'Réinitialiser le mot de passe' }}
        </button>
      </div>
    </div>
 
    <p class="text-center text-sm text-gray-400 mt-6">
      <a routerLink="/login" class="text-indigo-600 font-medium hover:underline no-underline">
        ← Retour à la connexion
      </a>
    </p>
 
  </div>
</div>
