 
<div class="min-h-screen bg-gray-50 flex items-center justify-center px-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
 
    <div class="text-center mb-8">
      <a routerLink="/" class="inline-flex items-center gap-1 no-underline">
        <span class="text-xl font-bold text-indigo-600">Lumina</span>
        <span class="text-xl font-bold text-gray-900">Media</span>
      </a>
      <p class="text-sm text-gray-400 mt-2">Créez votre compte gratuitement</p>
    </div>
 
    <div *ngIf="error" class="mb-4 px-4 py-3 bg-red-50 border border-red-100 rounded-xl text-sm text-red-600">
      {{ error }}
    </div>
 
    <div class="flex flex-col gap-4">
 
      <div class="flex gap-3">
        <div class="flex-1">
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Prénom</label>
          <input
            type="text"
            [(ngModel)]="firstName"
            placeholder="Jean"
            autocomplete="given-name"
            class="w-full px-4 py-2.5 text-sm border border-gray-200 rounded-xl outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-50 transition-all"/>
        </div>
        <div class="flex-1">
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Nom</label>
          <input
            type="text"
            [(ngModel)]="lastName"
            placeholder="Dupont"
            autocomplete="family-name"
            class="w-full px-4 py-2.5 text-sm border border-gray-200 rounded-xl outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-50 transition-all"/>
        </div>
      </div>
 
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
        <input
          type="email"
          [(ngModel)]="email"
          placeholder="vous@exemple.com"
          autocomplete="email"
          class="w-full px-4 py-2.5 text-sm border border-gray-200 rounded-xl outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-50 transition-all"/>
      </div>
 
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Mot de passe</label>
        <input
          type="password"
          [(ngModel)]="password"
          placeholder="••••••••"
          (keyup.enter)="submit()"
          autocomplete="new-password"
          class="w-full px-4 py-2.5 text-sm border border-gray-200 rounded-xl outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-50 transition-all"/>
      </div>
 
      <button
        (click)="submit()"
        [disabled]="loading || !firstName.trim() || !lastName.trim() || !email.trim() || !password"
        class="w-full py-2.5 text-sm font-semibold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 transition-all duration-200 disabled:opacity-60 mt-2">
        {{ loading ? 'Création...' : 'Créer mon compte' }}
      </button>
 
    </div>
 
    <p class="text-center text-sm text-gray-400 mt-6">
      Déjà un compte ?
      <a routerLink="/login" class="text-indigo-600 font-medium hover:underline no-underline">Se connecter</a>
    </p>
 
  </div>
</div>
